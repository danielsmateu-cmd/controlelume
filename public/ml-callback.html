<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Conectando ML...</title></head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:80px">Conectando com o Mercado Livre... aguarde.</p>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    sessionStorage.setItem("ml_oauth_code", code);
    window.location.href = "/controlelume/?ml_connected=1";
  } else {
    document.body.innerHTML = "<p style='text-align:center;color:red'>Erro: código não recebido.</p>";
  }
</script>
</body>
</html>
